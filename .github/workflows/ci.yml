name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-hygiene:
    name: Public history hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/check_public_hygiene.py --history

  linux:
    name: Linux compatibility / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # Current managed 3.12/3.13 builds bundle SQLite 3.50.4.  That is below
      # AIPCS's 3.51.3 safety minimum, so full SQLite integration coverage is
      # deliberately exercised by the supported 3.14 jobs below.
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      - run: >-
          uv run --python ${{ matrix.python-version }} pytest -q
          tests/application
          tests/storage_contracts
          tests/storage_postgresql/test_data_core_codecs.py
          tests/storage_postgresql/test_domain_schema.py
          tests/test_contracts.py
          tests/test_data_requests.py
          tests/test_data_results.py
          tests/test_manifest_v2.py
          tests/test_portable_io.py
          tests/test_records.py
          tests/test_relational.py

  linux-storage:
    name: Linux storage / Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --group dev --python 3.14
      - run: uv run --python 3.14 python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version; print(f'SQLite {sqlite3.sqlite_version}')"
      - run: uv run --python 3.14 ruff check .
      - run: uv run --python 3.14 pytest -q

  macos:
    name: macOS / Python 3.14
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --group dev --python 3.14
      - run: uv run --python 3.14 python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version; print(f'SQLite {sqlite3.sqlite_version}')"
      - run: uv run --python 3.14 ruff check .
      - run: uv run --python 3.14 pytest -q

  docker:
    name: Docker local SQLite image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build --tag aipcs-mcp:ci .
      - name: Validate the custom SQLite runtime
        run: >-
          docker run --rm --entrypoint python aipcs-mcp:ci
          -c "import sqlite3, sys; print(sqlite3.sqlite_version); sys.exit(0 if sqlite3.sqlite_version_info >= (3, 51, 3) else 1)"
      - name: Smoke the default stdio MCP server
        run: >-
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          | docker run --rm -i aipcs-mcp:ci
          | grep -q '"serverInfo":{"name":"aipcs"'
      - run: >-
          docker run --rm --entrypoint aipcs aipcs-mcp:ci
          config validate --profile postgresql --principal-id container-smoke
          --postgres-dsn-env AIPCS_DATABASE_DSN
      - name: Smoke the packaged Streamable HTTP listener
        run: |
          container_id="$(docker run --detach --rm --publish 127.0.0.1:18000:8000 \
            --entrypoint aipcs aipcs-mcp:ci serve --profile stateless \
            --transport streamable-http --http-host 0.0.0.0 --http-port 8000 \
            --http-allow-non-loopback true --http-allowed-hosts 127.0.0.1:18000)"
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          for attempt in {1..20}; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18000/mcp || true)"
            if [ "$status" = 406 ]; then
              exit 0
            fi
            sleep 0.5
          done
          exit 1
