name: Release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Exact-tip release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --group dev --python 3.14 --no-install-project
      - run: uv run --no-sync --python 3.14 python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version; print(f'SQLite {sqlite3.sqlite_version}')"
      - name: Prime isolated wheel-install cache
        shell: bash
        run: |
          warmup_dir="$(mktemp -d)"
          mkdir -p "$warmup_dir/source" "$warmup_dir/dist"
          git archive --format=tar HEAD | tar -x -C "$warmup_dir/source"
          uv build --wheel --out-dir "$warmup_dir/dist" "$warmup_dir/source"
          uv venv --python 3.14 "$warmup_dir/venv"
          wheels=("$warmup_dir"/dist/*.whl)
          uv pip install --python "$warmup_dir/venv/bin/python" "${wheels[0]}[postgresql]"
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --no-sync --python 3.14 python scripts/verify_release.py --exact-tip
      - name: Pull pinned PostgreSQL 16 fixture
        run: docker pull postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --no-sync --python 3.14 python scripts/verify_release.py --postgres-integration --postgres-major 16
