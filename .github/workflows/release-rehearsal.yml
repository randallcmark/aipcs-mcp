name: Release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Exact-tip release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: PYTHONDONTWRITEBYTECODE=1 uv run python scripts/verify_release.py --exact-tip --postgres-integration --postgres-major 16
