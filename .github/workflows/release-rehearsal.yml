name: Release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Exact-tip release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen --group dev --python 3.14
      - run: uv run --python 3.14 python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version; print(f'SQLite {sqlite3.sqlite_version}')"
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --python 3.14 python scripts/verify_release.py --exact-tip
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --python 3.14 python scripts/verify_release.py --postgres-integration --postgres-major 16
