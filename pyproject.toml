[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aipcs-mcp"
dynamic = ["version"]
description = "Contract-first MCP server for agent-defined persistent context services."
readme = "README.md"
requires-python = ">=3.12" # Matches the current reference implementation floor.
license = "Apache-2.0"
authors = [{ name = "Mark Randall" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.11,<3",
  "starlette>=0.45,<2",
  "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/randallcmark/aipcs-mcp"
Repository = "https://github.com/randallcmark/aipcs-mcp"
Issues = "https://github.com/randallcmark/aipcs-mcp/issues"

[project.scripts]
aipcs = "aipcs_mcp.cli:main"

[project.optional-dependencies]
postgresql = [
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8,<1",
]

[tool.setuptools.dynamic]
version = { attr = "aipcs_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM102"]
